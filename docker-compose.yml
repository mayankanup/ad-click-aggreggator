services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: adclick-kafka-cluster-01
    ports:
      - "29092:9094"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:9092 1 10 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: adclick
      POSTGRES_USER: adclick
      POSTGRES_PASSWORD: adclick
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  flink-jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres

  flink-taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager

  ad-click-service:
    build:
      context: .
      dockerfile: ad-click-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/adclick
      POSTGRES_USER: adclick
      POSTGRES_PASSWORD: adclick
    depends_on:
      - postgres
      - kafka

volumes:
  pgdata:
